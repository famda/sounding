server {
    listen 80;

    # Docker's resolver, looked up per request: assistant-api only runs with the gpu profile, and nginx would not
    # start with a static upstream it cannot resolve.
    resolver 127.0.0.11 valid=10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/catalog/ {
        set $catalog http://catalog-api:8080;
        proxy_pass $catalog;
    }

    location /api/orders {
        set $orders http://orders-api:8080;
        proxy_pass $orders;
    }

    location /api/assistant {
        set $assistant http://assistant-api:8080;
        proxy_pass $assistant;
    }

    location / {
        set $ui http://ui:3000;
        proxy_pass $ui;
    }
}
