# A small shop platform, each container wrapped with the agent, reporting to the stack in ../../docker-compose.yml.
#
#   users (outside, no agent) ─▶ host port 8088 ─▶ proxy (nginx)
#     proxy ─┬─▶ ui (node, renders pages server-side) ─▶ catalog-api
#            ├─▶ /api/catalog   ─▶ catalog-api ─▶ cache (redis), shop-db (postgres)
#            ├─▶ /api/orders    ─▶ orders-api  ─▶ catalog-api, shop-db
#            └─▶ /api/assistant ─▶ assistant-api ─▶ ollama (GPU)
#
# From the repository root, with the stack running:
#   docker compose -f samples/compose/docker-compose.yml --env-file .env up -d --build
# Profiles:
#   gpu        ollama and assistant-api, for the GPU pages (NVIDIA GPU); platform.ps1 start adds it when nvidia-smi
#              finds one. Ollama is the only sample with GPU access, so without it the dashboard reports no GPU.
#              Run by hand, also set SAMPLES_ASSISTANT=1 so the simulated users ask the assistant.
name: sounding-samples

x-agent: &agent
  SOUNDING_CONNECTION_STRING: "Host=db;Database=sounding;Username=sounding;Password=${SOUNDING_DB_PASSWORD:?run with --env-file .env};Keepalive=10"
  SOUNDING_HOST_DISPLAY_NAME: ${SOUNDING_HOST_DISPLAY_NAME:-}

x-agent-image: &agent-image
  "famda/sounding:agent-latest": service:agent

x-agent-volumes: &agent-volumes
  - /proc:/host/proc:ro
  - ${SOUNDING_HOST_DISK_MOUNT:-/var/lib/sounding/disk}:/host/disk:ro

x-sample: &sample
  networks: [sounding]
  environment: *agent
  volumes: *agent-volumes
  deploy: { resources: { limits: { cpus: "1", memory: 512M } } }
  # Optional (SOUNDING_SAMPLES_CAP_ADD in .env): SYS_PTRACE lets the agent read processes another user runs. Unset, it
  # adds AUDIT_WRITE, which Docker grants anyway, so nothing changes.
  cap_add: ["${SOUNDING_SAMPLES_CAP_ADD:-AUDIT_WRITE}"]
  restart: unless-stopped

x-api: &api
  <<: *sample
  build: { context: api, additional_contexts: *agent-image }
  depends_on: [shop-db, cache]
  # No swap: at the memory limit the kernel stops the process instead of swapping, as on most servers.
  memswap_limit: 512M

x-api-env: &api-env
  <<: *agent
  SHOP_DB_PASSWORD: Sounding-Sample-1

services:
  # Builds the agent image the samples copy it from; runs nothing.
  agent:
    build: { context: ../.., dockerfile: src/Sounding.Agent/Dockerfile }
    image: famda/sounding:agent-latest
    deploy: { replicas: 0 }

  # Simulated customers, outside the platform: from a network of their own, through the shop's published port, so
  # their requests reach the proxy from the host, as a real visitor's would. Not part of the platform: no agent.
  users:
    image: curlimages/curl:8.23.0
    networks: [outside]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [proxy]
    restart: unless-stopped
    # Whether the assistant runs (the gpu profile): platform.ps1 start sets it with the profile. Off, it is never asked,
    # so a missing service adds no failing requests; on, a failure (a 502 while it still pulls its model) only delays
    # the next question, doubling up to 5 minutes, and a success resets the delay.
    environment: { ASSISTANT: "${SAMPLES_ASSISTANT:-0}" }
    command:
      - sh
      - -c
      - |
        n=0
        delay=30
        next=0
        while :; do
          n=$$((n + 1))
          item=$$((n % 24 + 1))
          curl -s -o /dev/null http://host.docker.internal:8088/
          curl -s -o /dev/null http://host.docker.internal:8088/api/catalog/items/$$item
          curl -s -o /dev/null -H 'content-type: application/json' -d "{\"item\": $$item, \"qty\": 2}" http://host.docker.internal:8088/api/orders
          curl -s -o /dev/null http://host.docker.internal:8088/api/orders
          now=$$(date +%s)
          if [ "$$ASSISTANT" = 1 ] && [ $$now -ge $$next ]; then
            code=$$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
              -d '{"prompt": "Suggest a gift under 20 euros in one sentence."}' http://host.docker.internal:8088/api/assistant)
            if [ "$$code" = 200 ]; then delay=30; else delay=$$((delay * 2 > 300 ? 300 : delay * 2)); fi
            next=$$((now + delay))
          fi
          sleep 3
        done

  # Public entry point, published on the host: pages to the UI, each API path straight to its service.
  proxy:
    <<: *sample
    build: { context: ., args: { BASE: "nginx:1.31.8-alpine" }, additional_contexts: *agent-image }
    entrypoint: ["/opt/sounding/run", "/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    configs: [{ source: proxy, target: /etc/nginx/conf.d/default.conf }]
    depends_on: [ui, catalog-api, orders-api]
    ports: ["8088:80"]

  ui:
    <<: *sample
    build: { context: ., args: { BASE: "node:26.13.0-alpine" }, additional_contexts: *agent-image }
    entrypoint: ["/opt/sounding/run", "node", "/app/server.mjs"]
    configs: [{ source: ui, target: /app/server.mjs }]
    depends_on: [catalog-api]

  # One API image, three services: the proxy sends each only its own routes.
  catalog-api:
    <<: *api
    environment: { <<: *api-env, API_ROLE: catalog }

  orders-api:
    <<: *api
    environment: { <<: *api-env, API_ROLE: orders }

  assistant-api:
    <<: *api
    profiles: [gpu]
    depends_on: [ollama]
    environment: { <<: *api-env, API_ROLE: assistant, OLLAMA_MODEL: "gemma3:270m" }

  cache:
    <<: *sample
    build: { context: ., args: { BASE: "redis:8.10.3" }, additional_contexts: *agent-image }
    entrypoint: ["/opt/sounding/run", "docker-entrypoint.sh"]
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  shop-db:
    <<: *sample
    build: { context: ., args: { BASE: "postgres:18.6-alpine" }, additional_contexts: *agent-image }
    entrypoint: ["/opt/sounding/run", "docker-entrypoint.sh"]
    command: ["postgres"]
    environment:
      <<: *agent
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: Sounding-Sample-1
    volumes:
      - /proc:/host/proc:ro
      - ${SOUNDING_HOST_DISK_MOUNT:-/var/lib/sounding/disk}:/host/disk:ro
      - shop-db:/var/lib/postgresql

  ollama:
    <<: *sample
    profiles: [gpu]
    build: { context: ., args: { BASE: "ollama/ollama:0.40.16" }, additional_contexts: *agent-image }
    entrypoint: ["/opt/sounding/run", "/bin/ollama"]
    command: ["serve"]
    environment:
      <<: *agent
      # The assistant's answers are a sentence: a small context keeps the model well inside the memory limit.
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - /proc:/host/proc:ro
      - ${SOUNDING_HOST_DISK_MOUNT:-/var/lib/sounding/disk}:/host/disk:ro
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits: { cpus: "8", memory: 8G }
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

configs:
  proxy: { file: platform/proxy.conf }
  ui: { file: platform/ui.mjs }

volumes:
  shop-db:
  ollama-models:

networks:
  sounding:
    name: sounding_default
    external: true
  outside: {}
