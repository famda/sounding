<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="356" viewBox="36 34 1362 356" fill="none" role="img" aria-labelledby="tutorial-title tutorial-desc">
  <title id="tutorial-title">What the Kubernetes tutorial builds</title>
  <desc id="tutorial-desc">Docker Desktop's cluster has two nodes, desktop-control-plane and desktop-worker. Each runs a node agent, a client and a web server of the demo namespace, each with the Sounding agent built in. Each client calls the web servers on both nodes. Every agent sends metrics to the database in the sounding namespace, which the dashboard reads. You open the dashboard in your browser through kubectl port-forward on localhost:8080.</desc>
