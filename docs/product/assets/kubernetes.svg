<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="356" viewBox="36 34 1310 356" fill="none" role="img" aria-labelledby="k8s-title k8s-desc">
  <title id="k8s-title">Sounding on Kubernetes</title>
  <desc id="k8s-desc">A cluster with two nodes. Each node runs your pods, with the Sounding agent inside each container, and an optional node agent for the node's network, disks and GPU. Your namespace spans both nodes. Every agent sends metrics to the database in the sounding namespace, which the dashboard reads. You open the dashboard in your browser through kubectl port-forward.</desc>
