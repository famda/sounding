<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="458" viewBox="24 174 1232 458" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sounding: your containers, one clear picture</title>
  <desc id="description">Each of your hosts runs containers with a Sounding agent alongside your application. The agents send metrics to a shared PostgreSQL database, hosted independently in the cloud or on-premises. The Sounding dashboard connects to that same database and brings every host and container together in one live browser view.</desc>
  <defs>
    <linearGradient id="database" x1="566" y1="316" x2="706" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183a50"/>
      <stop offset="1" stop-color="#102531"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m2 1 5 4-5 4" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="container" viewBox="0 0 146 70">
      <rect x=".5" y=".5" width="145" height="69" rx="10" fill="#101c2c" stroke="#334155"/>
      <path d="m14 18 7-4 7 4v8l-7 4-7-4zm0 0 7 4 7-4m-7 4v8" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round"/>
      <text x="39" y="27" fill="#e2e8f0" font-size="15" font-weight="600">Your app</text>
      <rect x="9" y="41" width="128" height="21" rx="5" fill="#123438"/>
      <circle cx="21" cy="51.5" r="3" fill="#2dd4bf"/>
      <text x="32" y="56" fill="#99f6e4" font-size="12" font-weight="500">Sounding agent</text>
    </symbol>
    <symbol id="host" viewBox="0 0 18 18">
      <rect x="1" y="2" width="16" height="6" rx="2" stroke="currentColor" stroke-width="1.3"/>
      <rect x="1" y="10" width="16" height="6" rx="2" stroke="currentColor" stroke-width="1.3"/>
      <path d="M5 5h.01M5 13h.01M10 5h3M10 13h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="199" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">YOUR HOSTS</text>
    <rect x="48" y="222" width="356" height="132" rx="14" fill="#111b2b" stroke="#334155"/>
    <use href="#host" x="68" y="237" width="18" height="18" color="#94a3b8"/>
    <text x="98" y="251" fill="#cbd5e1" font-size="14" font-weight="600">Host 01</text>
    <circle cx="370" cy="246" r="3" fill="#2dd4bf"/>
    <use href="#container" x="68" y="266" width="146" height="70"/>
    <use href="#container" x="238" y="266" width="146" height="70"/>

    <rect x="48" y="378" width="356" height="132" rx="14" fill="#111b2b" stroke="#334155"/>
    <use href="#host" x="68" y="393" width="18" height="18" color="#94a3b8"/>
    <text x="98" y="407" fill="#cbd5e1" font-size="14" font-weight="600">Host 02</text>
    <circle cx="370" cy="402" r="3" fill="#2dd4bf"/>
    <use href="#container" x="68" y="422" width="146" height="70"/>
    <use href="#container" x="238" y="422" width="146" height="70"/>

    <g stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M404 288h40q20 0 20 20v40q0 20 20 20h70" marker-end="url(#arrow)"/>
      <path d="M404 444h40q20 0 20-20v-36q0-20 20-20"/>
    </g>
    <circle cx="404" cy="288" r="4" fill="#2dd4bf"/>
    <circle cx="404" cy="444" r="4" fill="#2dd4bf"/>
    <text x="486" y="348" fill="#99f6e4" font-size="13">Metrics</text>

    <text x="636" y="280" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">ONE SHARED DATABASE</text>
    <path d="M566 316v86c0 11 31 20 70 20s70-9 70-20v-86" fill="url(#database)" stroke="#4b9ba7" stroke-width="1.5"/>
    <path d="M566 346c0 11 31 20 70 20s70-9 70-20M566 374c0 11 31 20 70 20s70-9 70-20" stroke="#4b9ba7" stroke-width="1.5" stroke-opacity=".55"/>
    <ellipse cx="636" cy="316" rx="70" ry="20" fill="#1c4051" stroke="#67c6cd" stroke-width="1.5"/>
    <ellipse cx="636" cy="316" rx="48" ry="10" stroke="#67c6cd" stroke-opacity=".25"/>
    <text x="636" y="456" text-anchor="middle" fill="#94a3b8" font-size="14">Metrics &amp; history</text>
    <text x="636" y="480" text-anchor="middle" fill="#94a3b8" font-size="13">Cloud or on-premises</text>

    <path d="M718 368h126" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="781" y="348" text-anchor="middle" fill="#99f6e4" font-size="13">Live view</text>

    <text x="862" y="232" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">ONE LIVE DASHBOARD</text>
    <rect x="862" y="254" width="370" height="244" rx="14" fill="#0c1421" stroke="#475569" stroke-width="1.5"/>
    <path d="M863 294h368" stroke="#334155"/>
    <image href="logo.svg" x="880" y="262" width="24" height="24"/>
    <text x="910" y="279" fill="#e2e8f0" font-size="13" font-weight="600">Sounding</text>
    <text x="984" y="279" fill="#94a3b8" font-size="12">/ All hosts</text>
    <circle cx="1176" cy="274" r="3" fill="#2dd4bf"/>
    <text x="1186" y="279" fill="#99f6e4" font-size="11">Live</text>

    <g fill="#111e2d" stroke="#26374c">
      <rect x="880" y="312" width="156" height="76" rx="7"/>
      <rect x="1054" y="312" width="160" height="76" rx="7"/>
      <rect x="880" y="404" width="156" height="76" rx="7"/>
      <rect x="1054" y="404" width="160" height="76" rx="7"/>
    </g>
    <g fill="#cbd5e1" font-size="12" font-weight="600">
      <text x="893" y="333">CPU</text>
      <text x="1067" y="333">Memory</text>
      <text x="893" y="425">Disk</text>
      <text x="1067" y="425">Network</text>
    </g>
    <path d="m893 370 12-4 12 3 12-13 12 8 12-4 12 5 12-16 12 7 12-5 12 3 8-6" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    <rect x="1067" y="352" width="132" height="7" rx="3.5" fill="#26374c"/>
    <rect x="1067" y="352" width="88" height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="1067" y="368" width="132" height="4" rx="2" fill="#26374c"/>
    <rect x="1067" y="368" width="52" height="4" rx="2" fill="#2dd4bf"/>
    <path d="m893 465 12-2 12 2 12-5 12 3 12-20 12 16 12-5 12 8 12-2 12 4 8-4" stroke="#2dd4bf" stroke-width="2" stroke-linejoin="round"/>
    <path d="m1067 464 12-3 12 2 12-16 12 12 12-3 12 8 12-21 12 17 12-4 12 6 8-3" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>

    <path d="M48 548h1184" stroke="#263347"/>
    <g font-size="16" font-weight="600">
      <text x="48" y="584" fill="#5eead4">01</text>
      <text x="80" y="584" fill="#e2e8f0">Add the agent</text>
      <text x="475" y="584" fill="#5eead4">02</text>
      <text x="507" y="584" fill="#e2e8f0">Connect your containers</text>
      <text x="900" y="584" fill="#5eead4">03</text>
      <text x="932" y="584" fill="#e2e8f0">See the whole fleet</text>
    </g>
    <g fill="#94a3b8" font-size="14">
      <text x="80" y="610">Your app and Sounding, in the same image.</text>
      <text x="507" y="610">One destination for every host.</text>
      <text x="932" y="610">All your resources, in your browser.</text>
    </g>
  </g>
</svg>
