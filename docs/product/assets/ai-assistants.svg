<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="486" viewBox="0 0 1232 486" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sounding with AI assistants</title>
  <!-- Logos: Claude and GitHub Copilot from simple-icons 16.37.0; Codex and Open WebUI from Lobe Icons 1.102.0 (MIT); VS Code from Microsoft's VS Code brand icons. Each is a trademark of its owner, shown to name the product. -->
  <desc id="description">AI assistants such as Claude, Codex, GitHub Copilot, VS Code, or Open WebUI with a local model connect to the Sounding dashboard's MCP endpoint. The dashboard reads the shared database the agents report to, and gives the assistants read-only tools, prompts, resources, name suggestions and instructions. You ask in your own words and get answers backed by live data.</desc>
