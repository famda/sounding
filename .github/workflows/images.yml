name: Images

# Every push to main publishes agent-sha-<short sha> and dashboard-sha-<short sha>. Publishing a GitHub release
# tagged vX.Y.Z (or vX.Y.Z-rc.1, vX.Y.Z-preview.1) also publishes agent-X.Y.Z and dashboard-X.Y.Z, and moves
# agent-latest and dashboard-latest unless it's a pre-release.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/famda/sounding

jobs:
  build:
    name: ${{ matrix.component }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        component: [agent, dashboard]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Native runners: compiling the agent ahead of time under QEMU is slow and unreliable.
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: agent
            dockerfile: src/Sounding.Agent/Dockerfile
          - component: dashboard
            dockerfile: src/Sounding.Dashboard/Dockerfile
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      # Pushed by digest only; the publish job tags the multi-platform index.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }},mode=max
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.component }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless cosign signing with this workflow's identity
    strategy:
      fail-fast: false
      matrix:
        component: [agent, dashboard]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest moves only for a release that is neither marked pre-release nor has a -suffix version.
          tags: |
            type=sha,prefix=${{ matrix.component }}-sha-,format=short
            type=semver,pattern={{version}},prefix=${{ matrix.component }}-,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ matrix.component }}-latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
          flavor: |
            latest=false
      - id: index
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
